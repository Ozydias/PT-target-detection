# YOLOv12 + P2 Small Object Enhancement
# Author: 徐文彬（建议你论文里署名）
# Task: Small object detection (Parathyroid)

# =====================
# Parameters
# =====================
nc: 1  # number of classes（记得换成你自己的）
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# =====================
# Backbone
# =====================
backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv,  [64, 3, 2]]              # 0 - P1 /2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # 1 - P2 /4 ⭐（小目标关键层）
  - [-1, 2, C3k2,  [256, False, 0.25]]

  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # 3 - P3 /8
  - [-1, 2, C3k2,  [512, False, 0.25]]

  - [-1, 1, Conv,  [512, 3, 2]]             # 5 - P4 /16
  - [-1, 4, A2C2f, [512, True, 4]]

  - [-1, 1, Conv,  [1024, 3, 2]]            # 7 - P5 /32
  - [-1, 4, A2C2f, [1024, True, 1]]

# =====================
# Head (PAN + P2)
# =====================
head:
  # -------- P5 → P4 --------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # P4

  # -------- P4 → P3 --------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]        # P3

  # -------- P3 → P2 ⭐ 新增 --------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]               # concat backbone P2
  - [-1, 2, A2C2f, [256, False, -1]]        # P2（小目标检测层）- 使用256确保所有scale下通道数满足要求

  # -------- 下采样回 P3 --------
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, A2C2f, [256, False, -1]]        # P3 refine

  # -------- 下采样回 P4 --------
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]        # P4 refine

  # -------- 下采样回 P5 --------
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]             # P5 refine

  # =====================
  # Detect (P2, P3, P4, P5)
  # =====================
  - [[16, 19, 22, 25], 1, Detect, [nc]]
