# YOLOv12 🚀 Final version for Parathyroid Detection
# Improvement: Single lightweight ECA attention in high-level backbone

nc: 1  # 甲状旁腺（单类）

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ---------------- Backbone ----------------
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]             # P1/2
  - [-1, 1, Conv,  [128, 3, 2, 1, 2]]       # P2/4
  - [-1, 2, C3k2,  [256, False, 0.25]]

  - [-1, 1, Conv,  [256, 3, 2, 1, 4]]       # P3/8
  - [-1, 2, C3k2,  [512, False, 0.25]]

  - [-1, 1, Conv,  [512, 3, 2]]             # P4/16
  - [-1, 4, A2C2f, [512, True, 4]]

  # ★ 唯一的改进点：ECA 注意力（高语义层）
  - [-1, 1, ECAModule, [512]]

  - [-1, 1, Conv,  [1024, 3, 2]]            # P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]

# ---------------- Head ----------------
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]               # P4 fusion
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]               # P3 fusion
  - [-1, 2, A2C2f, [256, False, -1]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f, [512, False, -1]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[14, 17, 20], 1, Detect, [nc]]
